name: Vercel Deployment Purge

on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Run purge (giyuen-lift - 최근 5개 보존)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== giyuen-lift 배포 목록 ==="
          vercel list giyuen-lift --token $VERCEL_TOKEN --limit 100 || true
          
          # 최근 5개 제외하고 나머지 삭제
          URLS=$(vercel list giyuen-lift --token $VERCEL_TOKEN --limit 100 2>/dev/null \
            | grep -oP 'https://giyuen-lift-[a-z0-9]+-dragonrpa\.vercel\.app' \
            | tail -n +6)
          
          if [ -z "$URLS" ]; then
            echo "삭제 대상 없음 (5개 이하)"
          else
            echo "$URLS" | while read url; do
              echo "삭제: $url"
              vercel rm "$url" --token $VERCEL_TOKEN --yes || true
            done
            echo "정리 완료"
          fi
